<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollShield</title>
    <style>
      #killSwitch {
        display: block;
        width: 100%;
        padding: 12px 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background-color: #dc2626; /* Default red state */
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease,
          box-shadow 0.2s ease;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        text-align: center;
        outline: none;
      }

      #killSwitch:hover {
        opacity: 0.92;
        transform: translateY(-1px);
        box-shadow:
          0 6px 8px -1px rgba(0, 0, 0, 0.15),
          0 3px 6px -1px rgba(0, 0, 0, 0.1);
      }

      #killSwitch:active {
        transform: translateY(0);
        box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
      }
      button#addBtn {
        width: 100%;
        padding: 10px;
        background: #3b82f6;
        color: white;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 8px;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
        box-shadow: 0 1px 2px rgba(59, 130, 246, 0.2);
        margin-bottom: 14px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font-size: 13px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: 8px;
        outline: none;
        transition: all 0.2s ease;
        margin-bottom: 8px;
      }

      input:hover {
        border-color: var(--text-secondary);
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      input::placeholder {
        color: var(--text-secondary);
      }

      #termList {
        list-style: none;
        padding: 0;
        max-height: 140px;
        overflow-y: auto;
        margin-bottom: 16px;
      }

      li {
        background-color: var(--card-bg);
        color: var(--text-primary);
        padding: 8px 10px;
        margin-bottom: 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }

      .delete-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        padding: 0 4px;
        border-radius: 4px;
        transition:
          color 0.2s ease,
          background 0.2s ease;
      }

      .delete-btn:hover {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: #334155;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        width: 320px;
        background-color: var(--bg-color);
        color: var(--text-primary);
        padding: 16px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .header h1 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--text-primary);
      }

      .section {
        margin-bottom: 16px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .toggle-card {
        background-color: var(--card-bg);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
        border: 1px solid var(--border);
        transition: border-color 0.2s ease;
      }

      .toggle-card:hover {
        border-color: var(--accent);
      }

      .toggle-label {
        font-size: 13px;
        color: var(--text-primary);
        cursor: pointer;
        user-select: none;
        flex-grow: 1;
        padding-right: 10px;
      }

      /* Modern iOS-style Toggle Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #475569;
        transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 20px;
      }

      .slider:before {
        position: absolute;
        content: '';
        height: 16px;
        width: 16px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: var(--accent);
      }

      input:checked + .slider:before {
        transform: translateX(16px);
      }

      #status {
        font-size: 11px;
        color: var(--text-secondary);
        text-align: center;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>ScrollShield</h1>
    </div>
    <button id="killSwitch">Turn Off Everything</button>

    <h3>Choose keywords to block</h3>
    <input
      type="text"
      id="termInput"
      placeholder="type what you dont wanna see on the web"
    />
    <button id="addBtn">Add Term</button>
    <ul id="termList"></ul>

    <h3>Ignored Keywords</h3>
    <ul id="term-list"></ul>
    <button
      id="clear-all"
      style="width: 100%; margin-top: 10px; background: #6b7280"
    >
      Clear All Ignored Terms
    </button>
    <!-- YouTube Section -->
    <div class="section">
      <a
        href="whyalgorithmsaredangerous.html"
        target="_blank"
        style="
          text-decoration: none;
          color: var(--accent);
          font-size: 11px;
          display: block;
          margin-bottom: 8px;
        "
        >Why Algorithms Are Dangerous</a
      >
      <div class="section-title">YouTube</div>

      <div class="toggle-card">
        <label for="toggleButton" class="toggle-label"
          >Block YT Home Feed-also redirects to subscriptions</label
        >
        <label class="switch">
          <input type="checkbox" id="toggleButton" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-card">
        <label for="commentsToggle" class="toggle-label">Block Comments</label>
        <label class="switch">
          <input type="checkbox" id="commentsToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-card">
        <label for="sidebarToggle" class="toggle-label">Block Sidebar</label>
        <label class="switch">
          <input type="checkbox" id="sidebarToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- TikTok Section -->
    <div class="section">
      <div class="section-title">TikTok</div>

      <div class="toggle-card">
        <label for="tiktokTogglefeed" class="toggle-label">Block Feed</label>
        <label class="switch">
          <input type="checkbox" id="tiktokTogglefeed" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Other Platforms Section -->
    <div class="section">
      <div class="section-title">Other Platforms</div>

      <div class="toggle-card">
        <label for="redditTogglefeed" class="toggle-label"
          >Block Reddit Feed</label
        >
        <label class="switch">
          <input type="checkbox" id="redditTogglefeed" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-card">
        <label for="huluTogglefeed" class="toggle-label">Block Hulu Feed</label>
        <label class="switch">
          <input type="checkbox" id="huluTogglefeed" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-card">
        <label for="instagramTogglefeed" class="toggle-label"
          >Block Instagram Feed</label
        >
        <label class="switch">
          <input type="checkbox" id="instagramTogglefeed" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-card">
        <label for="xTogglefeed" class="toggle-label">Block X Feed</label>
        <label class="switch">
          <input type="checkbox" id="xTogglefeed" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-card">
        <label for="netflixTogglefeed" class="toggle-label"
          >Block Netflix Feed</label
        >
        <label class="switch">
          <input type="checkbox" id="netflixTogglefeed" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
